# amdgpu display workaround for the Framework 13 (Ryzen AI 9 HX 370 / 890M).
#
# dcdebugmask=0x600 = DC_DISABLE_PSR_SU (0x200) | DC_DISABLE_REPLAY (0x400):
# turns off partial-update panel self refresh and Panel Replay, the two
# features behind the screen-freeze reports on this platform. Full-frame panel
# self refresh (PSR v1) stays on, which bin/power-profiles.sh relies on for
# idle power in power-saver.
#
# This file is the single source for the option: it is NOT also set on the
# kernel command line (/etc/kernel/cmdline). dracut copies /etc/modprobe.d
# into the initrd, so the initrd must be rebuilt after edits.
#
# Install:
#   sudo install -D -m 644 ~/dotfiles/system/modprobe.d/amdgpu.conf \
#     /etc/modprobe.d/amdgpu.conf
#   sudo dracut -f
# Verify after reboot:
#   cat /sys/module/amdgpu/parameters/dcdebugmask   # expect 1536 (0x600)
options amdgpu dcdebugmask=0x600

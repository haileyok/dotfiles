# power-profiles-daemon's amdgpu_panel_power action only enables panel power
# savings below 50% battery in power-saver, and would fight with
# ~/dotfiles/bin/power-profiles.sh, which now sets the level per profile.
#
# Install:
#   sudo install -D -m 644 ~/dotfiles/system/power-profiles-daemon/block-panel-power.conf \
#     /etc/systemd/system/power-profiles-daemon.service.d/block-panel-power.conf
#   sudo systemctl daemon-reload && sudo systemctl restart power-profiles-daemon
[Service]
ExecStart=
ExecStart=/usr/libexec/power-profiles-daemon --block-action=amdgpu_panel_power

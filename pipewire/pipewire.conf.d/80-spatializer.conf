# Head-tracked spatial audio for the AirPods (goal-002).
#
# Creates the "AirPodsSpatial" sink: stereo in -> two SOFA spatializers
# (left/right virtual speakers) -> stereo out, targeting the AirPods sink.
# The head-tracking driver (~/personal/headtracking-capture/spatial-driver.py,
# started by hand or via sway exec) polls the MagicPodsCore backend's
# AACP 0x17 quaternion and drives spat_left/spat_right Azimuth/Elevation
# via `pw-cli set-param` so the virtual speakers stay anchored in the world
# while the head moves — the Apple spatial-audio behavior.
#
# Loaded from ~/.config/pipewire/pipewire.conf.d (symlinked from dotfiles).
# Select the AirPodsSpatial sink in an app (or set it default) to hear it.
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "AirPods Spatial (head-tracked)"
            media.name       = "AirPods Spatial"
            filter.graph = {
                nodes = [
                    {   type   = sofa
                        name   = spat_left
                        label  = spatializer
                        config = {
                            filename = "/home/hailey/personal/headtracking-capture/subject_021.sofa"
                            gain = 0.45
                            normalize = true
                        }
                        control = { "Azimuth" = 30 "Elevation" = 0 "Radius" = 1.0 }
                    }
                    {   type   = sofa
                        name   = spat_right
                        label  = spatializer
                        config = {
                            filename = "/home/hailey/personal/headtracking-capture/subject_021.sofa"
                            gain = 0.45
                            normalize = true
                        }
                        control = { "Azimuth" = 330 "Elevation" = 0 "Radius" = 1.0 }
                    }
                    {   type   = builtin
                        name   = mix_l
                        label  = mixer
                        control = { "Gain 1" = 0.5 "Gain 2" = 0.5 }
                    }
                    {   type   = builtin
                        name   = mix_r
                        label  = mixer
                        control = { "Gain 1" = 0.5 "Gain 2" = 0.5 }
                    }
                ]
                inputs  = [ "spat_left:In" "spat_right:In" ]
                links = [
                    { output = "spat_left:Out L"  input = "mix_l:In 1" }
                    { output = "spat_left:Out R"  input = "mix_r:In 1" }
                    { output = "spat_right:Out L" input = "mix_l:In 2" }
                    { output = "spat_right:Out R" input = "mix_r:In 2" }
                ]
                outputs = [ "mix_l:Out" "mix_r:Out" ]
            }
            capture.props = {
                node.name      = "effect_input.spatializer"
                node.description = "AirPods Spatial (head-tracked)"
                media.class    = "Audio/Sink"
                audio.channels = 2
                audio.position  = [ FL FR ]
            }
            playback.props = {
                node.name      = "effect_output.spatializer"
                node.passive   = true
                node.target    = "bluez_output.F8_D3_F0_5A_41_B9.1"
                audio.channels = 2
                audio.position  = [ FL FR ]
                stream.dont-remix = true
            }
        }
    }
]

# hyprlock — screen locker ($lock in sway/config; also used by swayidle).
# Installed via zypper, NOT nix (nix Mesa lacks the AMD driver; PAM must be system).
# Fingerprint: talks to fprintd directly over D-Bus and listens in parallel
# with the password field, so just touch the sensor — no Enter needed.
# Enroll with `fprintd-enroll`; check with `fprintd-list $USER`.
# Theme: Tokyo Night.

$font = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Touch the sensor to unlock
        present_message = Scanning…
        retry_delay = 250
    }
}

animations {
    enabled = false
}

background {
    monitor =
    path = /home/hailey/dotfiles/bg.jpg
    color = rgb(1a1b26)
    blur_passes = 0
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgb(a9b1d6)
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 4
    rounding = -1

    inner_color = rgb(1a1b26)
    outer_color = rgb(7aa2f7)
    check_color = rgb(7aa2f7)
    fail_color = rgb(f7768e)
    capslock_color = rgb(ff9e64)
    font_color = rgb(a9b1d6)

    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3

    position = 0, 0
    halign = center
    valign = center
}

# Fingerprint status ("Touch the sensor…", "Scanning…", errors)
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(a9b1d6)
    font_size = 16
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

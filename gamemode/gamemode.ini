; GameMode config — symlinked to ~/.config/gamemode.ini by setup.sh.
; Reference: /usr/share/doc/packages/gamemoded/gamemode.ini
;
; Tuned for the Framework 13 (Ryzen AI 9 HX 370 / Radeon 890M iGPU).
; CPU and iGPU share one power + thermal budget, so the usual "max
; everything" game mode is counterproductive here: profiling showed that in
; PPD "performance" the CPU cores ate ~16 W and tripped the core thermal
; limit, which dragged the iGPU down to ~1.4 GHz. In "balanced" the cores sit
; at ~4 W and the iGPU sustains ~2.3 GHz. So game mode = give the GPU the
; budget, not the CPU.
;
; Reload after edits: systemctl --user restart gamemoded

[general]
reaper_freq=5

; With amd-pstate-epp, the "performance" governor forces EPP=performance on
; every core — exactly the CPU boost behaviour we want to avoid. Keep the
; stock powersave governor (EPP is still driven by the PPD profile).
desiredgov=powersave
igpu_desiredgov=powersave
; Disable GameMode's iGPU/CPU power-ratio heuristic; we always want powersave.
igpu_power_threshold=-1

softrealtime=off
; Renicing needs membership in the `gamemode` group; leave off for now.
renice=0
ioprio=0
inhibit_screensaver=1
; Toggling split_lock_mitigate needs pkexec + the `gamemode` group (we're not
; in it, so it just logs "Not authorized"). Split-lock stalls mostly matter on
; Intel and for a few Proton titles; off until one needs it.
disable_splitlock=0

[gpu]
; Don't touch amdgpu clocks: the iGPU is power/thermal limited, forcing
; "high" only adds heat.
apply_gpu_optimisations=0

[custom]
; Switch to PPD balanced for the session and restore the previous profile
; afterwards (bin/gamemode-hook.sh). GameMode runs these once when the first
; game registers and once when the last one exits.
start=/home/hailey/dotfiles/bin/gamemode-hook.sh start
end=/home/hailey/dotfiles/bin/gamemode-hook.sh end
script_timeout=10

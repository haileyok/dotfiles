# Workaround for the kernel/BlueZ SCO setup race (bluez#2562, bluez#2545):
# PipeWire's mSBC negotiation can tear down a transport mid-setup, leaving a
# stuck link the kernel then drops all inbound SCO packets for
# ("SCO packet for unknown connection handle" in dmesg). Removing msbc from
# the codec list makes HFP negotiate CVSD directly — confirmed working on the
# sibling MediaTek MT7921 chip (0/20 -> 100% captures). Cost: 8 kHz narrowband
# mic during calls (A2DP listening is unaffected — stays on AAC).
#
# This machine: MediaTek MT7925 (RZ717) on a Framework 16, kernel 7.2.8
# (fix series "Fix SCO setup failures after an abandoned setup" not yet in a
# release kernel). If a future kernel carries that series, this file can be
# removed and msbc restored.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc sbc_xq aac cvsd ]
}

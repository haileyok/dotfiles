# ALC285 speaker fix (Framework 13 Pro): route volume control through
# PipeWire software volume instead of the hardware mixer. The hardware amp
# runs at partial level by default (77%, -15dB), which makes the small
# speakers sound weak and flat. With the soft mixer enabled, the hardware
# volume can be pinned at 100% (via alsamixer + `sudo alsactl store`) and
# volume changes happen in software.
#
# Pattern from the Framework community (applied for c1:00.6, this machine's
# Ryzen HD Audio Controller):
# https://community.frame.work/t/framework-16-speaker-volume-curve-issue/78591
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_c1_00.6"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]

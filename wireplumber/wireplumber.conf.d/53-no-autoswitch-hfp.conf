# Disable WirePlumber's automatic switch to the HFP/headset profile when an
# app opens a recording stream. With the fork's hi-res mic (AAC-ELD over AACP
# opcode 0x58, exposed as the "AirPodsHiRes" source — see flake.nix
# magicpods-fork), HFP is never needed: Meet & friends capture from
# AirPodsHiRes while A2DP playback stays at full quality (macOS-style).
# Without this, opening the mic in a call drops the buds to 8 kHz HFP for
# BOTH directions — the "audio turns awful in Google Meet" symptom.
#
# NOTE on syntax: this is set via the wireplumber.conf fragment below AND was
# applied at runtime with `wpctl settings bluetooth.autoswitch-to-headset-profile false`
# (the runtime setting id). The 52-bluez-hfp-cvsd.conf codec list uses
# monitor.bluez.properties — that section does NOT carry this setting in
# current WirePlumber; wireplumber.settings is the one that does.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

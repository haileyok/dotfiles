# Disable WirePlumber's automatic switch to the HFP/headset profile when an
# app opens a recording stream. With the fork's hi-res mic (AAC-ELD over AACP
# opcode 0x58, exposed as the "AirPodsHiRes" source — see flake.nix
# magicpods-fork), HFP is never needed: Meet & friends should capture from
# AirPodsHiRes while A2DP playback stays at full AAC quality (macOS-style).
# Without this, opening the mic in a call drops the buds to 8 kHz HFP for
# BOTH directions — the "audio turns awful in Google Meet" symptom.
# If the fork backend isn't running, the standard HFP path (CVSD-only, see
# 52-bluez-hfp-cvsd.conf) still works if you switch profiles manually.
monitor.bluez.properties = {
  bluez5.auto-switch-to-headset-profile = false
}
